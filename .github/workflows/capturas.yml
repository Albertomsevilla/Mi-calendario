name: Generar capturas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mi-calendario.html
      - tools/**
      - .github/workflows/capturas.yml

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Hacer capturas
        run: |
          mkdir -p img
          node tools/capturas.js
      - name: Guardar capturas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Actualizar capturas del README"
          git push
